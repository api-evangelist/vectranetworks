openapi: 3.2.0
info:
  title: Vectranetworks Accounts API
  version: '1.0'
  description: 'Operations tagged Accounts across 2 of this provider''s published API definitions: vectranetworks-detect-v2.3-openapi.yml, vectranetworks-rux-v3.3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{fqdn}/api/{apiVersion}
  description: Vectra Detect API
  variables:
    fqdn:
      description: The FQDN or IP to join the Vectra Detect instance
      default: detect-api.demo.vectra.io
    apiVersion:
      description: The API version to use
      default: v2.3
- url: https://{vectra_portal_url}/api/v3.3
  description: Vectra Platform API Server
  variables:
    vectra_portal_url:
      default: platform.vectra.ai
tags:
- name: Accounts
  description: Dedicated endpoint to Accounts.
paths:
  /accounts:
    description: Accounts objects.
    get:
      operationId: accountGetSeveral
      summary: Get several Accounts
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/ordering'
      - $ref: '#/components/parameters/state'
      - $ref: '#/components/parameters/oneOfTags'
      - $ref: '#/components/parameters/certaintyScore'
      - $ref: '#/components/parameters/certaintyScoreGte'
      - $ref: '#/components/parameters/maxID'
      - $ref: '#/components/parameters/minID'
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/noteModifiedTimestampGte'
      - $ref: '#/components/parameters/privilegeCategory'
      - $ref: '#/components/parameters/privilegeLevel'
      - $ref: '#/components/parameters/privilegeLevelGte'
      - $ref: '#/components/parameters/threatScore'
      - $ref: '#/components/parameters/threatScoreGte'
      - name: fields
        description: Filters returned attributes
        in: query
        schema:
          $ref: '#/components/schemas/queryAccountFields'
        style: form
        explode: false
      - name: all
        description: No filter, returns all objects
        in: query
        schema:
          type: boolean
        allowEmptyValue: true
        deprecated: true
      responses:
        '200':
          description: Retrieved Accounts successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultsOfAccounts'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /accounts/{accountID}:
    parameters:
    - name: accountID
      description: ID of the Account you're looking for
      in: path
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: accountGetSingle
      summary: Describe a specific Account
      tags:
      - Accounts
      parameters:
      - name: fields
        description: Filters returned attributes
        in: query
        schema:
          $ref: '#/components/schemas/queryAccountFields'
        style: form
        explode: false
      responses:
        '200':
          description: Describe a specific Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
        '404':
          $ref: '#/components/responses/notFound'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /accounts/{accountID}/notes:
    parameters:
    - name: accountID
      description: ID of the Account notes you're looking for
      in: path
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: accountNotesGetSeveral
      summary: Get all account notes
      tags:
      - Accounts
      responses:
        '200':
          description: Retrieved account notes successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/note'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    post:
      operationId: accountNoteCreate
      summary: Create a new Account note
      tags:
      - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noteRequestBody'
      responses:
        '200':
          description: Account note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /accounts/{accountID}/notes/{noteID}:
    parameters:
    - name: accountID
      description: ID of the Account you're looking for
      in: path
      schema:
        $ref: '#/components/schemas/ID'
    - name: noteID
      description: ID of the Note you're looking for
      in: path
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: accountNoteGetSingle
      summary: Get a single Account note
      tags:
      - Accounts
      responses:
        '200':
          description: Retrieved account note successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    patch:
      operationId: accountNoteUpdate
      summary: Update an existing Account note
      tags:
      - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/noteRequestBody'
      responses:
        '200':
          description: Account note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/note'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    delete:
      operationId: accountNoteDelete
      summary: Delete an existing Account note
      tags:
      - Accounts
      responses:
        '200':
          description: Account note deleted
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /search/accounts:
    description: Search for accounts objects.
    get:
      operationId: searchAccounts
      summary: Search for Accounts
      tags:
      - Accounts
      parameters:
      - $ref: '#/components/parameters/pageNumber'
      - $ref: '#/components/parameters/pageSize'
      - name: query_string
        description: The Lucene search query
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Retrieved Hosts successfully
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /tagging/account/{accountID}:
    description: The tagging endpoint can be used to manage Account tags
    parameters:
    - name: accountID
      description: ID of the Account you're looking for
      in: path
      schema:
        $ref: '#/components/schemas/ID'
    get:
      operationId: accountTagsGetAll
      summary: Get all Account's tags
      tags:
      - Accounts
      responses:
        '200':
          description: Retrieved tags successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tags'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    patch:
      operationId: accountTagsReplace
      summary: Replace all Account's tags
      tags:
      - Accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tagsRequestBody'
      responses:
        '200':
          description: Replaced tags successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tags'
        '401':
          $ref: '#/components/responses/invalidToken'
        '403':
          $ref: '#/components/responses/invalidPermissions'
      security:
      - VectraToken: []
    servers:
    - url: https://{fqdn}/api/{apiVersion}
      description: Vectra Detect API
      variables:
        fqdn:
          description: The FQDN or IP to join the Vectra Detect instance
          default: detect-api.demo.vectra.io
        apiVersion:
          description: The API version to use
          default: v2.3
  /accounts/{account_id}:
    get:
      summary: Retrieve single account details
      operationId: getAccountById
      tags:
      - Accounts
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
        description: Unique ID for the account
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
      security:
      - oauth2: []
    post:
      summary: Add note to account
      tags:
      - Accounts
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Created note
      security:
      - oauth2: []
    servers:
    - url: https://{vectra_portal_url}/api/v3.3
      description: Vectra Platform API Server
      variables:
        vectra_portal_url:
          default: platform.vectra.ai
  /accounts/{id}/notes:
    get:
      summary: Get account notes
      tags:
      - Accounts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
      security:
      - oauth2: []
    servers:
    - url: https://{vectra_portal_url}/api/v3.3
      description: Vectra Platform API Server
      variables:
        vectra_portal_url:
          default: platform.vectra.ai
components:
  parameters:
    minID:
      name: min_id
      description: Filters by ID greater than or equals the provided ID
      in: query
      schema:
        $ref: '#/components/schemas/ID'
    privilegeLevel:
      name: privilege_level
      description: Filters by exact privilege level
      in: query
      schema:
        $ref: '#/components/schemas/privilegeLevel'
    privilegeCategory:
      name: privilege_category
      description: Filters by privilege category
      in: query
      schema:
        $ref: '#/components/schemas/privilegeCategory'
    noteModifiedTimestampGte:
      name: note_modified_timestamp_gte
      description: Filters on detection'notes modified timestamp
      in: query
      schema:
        $ref: '#/components/schemas/isoDate'
    pageSize:
      name: page_size
      description: The number of results to return per page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5000
      example: 50
    certaintyScoreGte:
      name: c_score_gte
      description: Filters by certainty score greater than or equals the provided score
      in: query
      schema:
        $ref: '#/components/schemas/vectraScore'
    state:
      name: state
      description: Filters by state
      in: query
      schema:
        $ref: '#/components/schemas/state'
    certaintyScore:
      name: c_score
      description: Filters by certainty score
      in: query
      schema:
        $ref: '#/components/schemas/vectraScore'
    ordering:
      name: ordering
      description: Orders results based on given attribute. Results can be sorted in descending order by prepending the query with “minus” symbol.
      in: query
      schema:
        type: string
    pageNumber:
      name: page
      description: The page result to look at
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
    threatScoreGte:
      name: t_score_gte
      description: Filters by threat score greater than or equals the provided score
      in: query
      schema:
        $ref: '#/components/schemas/vectraScore'
    threatScore:
      name: t_score
      description: Filters by threat score
      in: query
      schema:
        $ref: '#/components/schemas/vectraScore'
    name:
      name: name
      description: Filters by name
      in: query
      schema:
        $ref: '#/components/schemas/name'
    oneOfTags:
      name: tags
      description: Filters by tags. Returns entries that contain any of the tags specified
      in: query
      schema:
        $ref: '#/components/schemas/arrayOfNames'
    maxID:
      name: max_id
      description: Filters by ID lower than or equals the provided ID
      in: query
      schema:
        $ref: '#/components/schemas/ID'
    privilegeLevelGte:
      name: privilege_level_gte
      description: Filters Account having a privilege level greater than or equal to the supplied number
      in: query
      schema:
        $ref: '#/components/schemas/privilegeLevel'
  schemas:
    text:
      type: string
    assignmentOutcomeCategory:
      title: Assignment Outcome allowed categories
      type: string
      enum:
      - benign_true_positive
      - malicious_true_positive
      - false_positive
    assignmentOutcome:
      description: Label resolution outcome for an assignment
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        builtin:
          type: boolean
        user_selectable:
          type: boolean
        title:
          type: string
        category:
          $ref: '#/components/schemas/assignmentOutcomeCategory'
      required:
      - id
      - builtin
      - user_selectable
      - title
      - category
    noteRequestBody:
      type: object
      properties:
        note:
          $ref: '#/components/schemas/text'
      required:
      - note
    arrayOfNames:
      description: Array of names
      type: array
      items:
        $ref: '#/components/schemas/name'
    severity:
      description: Severity
      type: string
      enum:
      - low
      - Low
      - medium
      - Medium
      - high
      - High
      - critical
      - Critical
      example: medium
    assignmentHistorycalEvent:
      description: Assignment history event
      type: object
      properties:
        assignment_id:
          $ref: '#/components/schemas/ID'
        actor:
          $ref: '#/components/schemas/ID'
        event_type:
          $ref: '#/components/schemas/assignmentEventType'
        datetime:
          $ref: '#/components/schemas/isoDate'
        context:
          type: object
          properties:
            from:
              $ref: '#/components/schemas/ID'
            to:
              $ref: '#/components/schemas/ID'
            entity_c_score:
              $ref: '#/components/schemas/vectraScore'
            entity_t_score:
              $ref: '#/components/schemas/vectraScore'
            triage_as:
              type:
              - string
              - 'null'
            triaged_detection_ids:
              oneOf:
              - $ref: '#/components/schemas/arrayOfIDs'
              - type:
                - string
                - 'null'
            fixed_detection_ids:
              oneOf:
              - $ref: '#/components/schemas/arrayOfIDs'
              - type:
                - string
                - 'null'
            created_rule_ids:
              oneOf:
              - $ref: '#/components/schemas/arrayOfIDs'
              - type:
                - string
                - 'null'
    resultsOfAccounts:
      allOf:
      - $ref: '#/components/schemas/results'
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/account'
    vectraScore:
      type: number
      minimum: 0
      maximum: 99
      example: 80
    tagsRequestBody:
      type: object
      properties:
        tags:
          type: array
          items:
          - $ref: '#/components/schemas/text'
      required:
      - tags
    assignment:
      description: Assignment
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        assigned_by:
          $ref: '#/components/schemas/assignmentUser'
        date_assigned:
          $ref: '#/components/schemas/isoDate'
        date_resolved:
          oneOf:
          - $ref: '#/components/schemas/isoDate'
          - type:
            - number
            - 'null'
        events:
          type: array
          items:
            $ref: '#/components/schemas/assignmentHistorycalEvent'
        outcome:
          oneOf:
          - $ref: '#/components/schemas/assignmentOutcome'
          - type:
            - string
            - 'null'
        resolved_by:
          oneOf:
          - $ref: '#/components/schemas/assignmentUser'
          - type:
            - string
            - 'null'
        triaged_detections:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ID'
        host_id:
          oneOf:
          - $ref: '#/components/schemas/ID'
          - type:
            - string
            - 'null'
        account_id:
          oneOf:
          - $ref: '#/components/schemas/ID'
          - type:
            - string
            - 'null'
        assigned_to:
          $ref: '#/components/schemas/assignmentUser'
      required:
      - id
      - assigned_by
      - date_assigned
      - assigned_to
    privilegeLevel:
      type:
      - number
      - 'null'
      minimum: 1
      maximum: 10
      example: 8
    error:
      type: object
      properties:
        detail:
          description: A human readable error message
          type: string
        details:
          description: A human readable error message
          type: string
    assignmentEventType:
      description: Type of event that can happen to an assignment
      type: string
      enum:
      - created
      - reassigned
      - resolved
      example: created
    positiveInt:
      type: integer
      format: int32
      minimum: 0
    name:
      type: string
      minLength: 1
    isoDate:
      description: ISO representation of a date
      type: string
      format: date-time
      example: '2022-01-01T00:00:00Z'
    link:
      description: URL Link
      type:
      - string
      - 'null'
      format: uri
      example: https://dummy.link
    arrayOfIDs:
      description: Array of IDs
      type: array
      items:
        $ref: '#/components/schemas/ID'
    arrayOfLinks:
      description: Array of links
      type: array
      items:
        $ref: '#/components/schemas/link'
    note:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        date_created:
          oneOf:
          - $ref: '#/components/schemas/isoDate'
          - type:
            - string
            - 'null'
        date_modified:
          oneOf:
          - $ref: '#/components/schemas/isoDate'
          - type:
            - string
            - 'null'
        created_by:
          $ref: '#/components/schemas/name'
        modified_by:
          oneOf:
          - $ref: '#/components/schemas/name'
          - type:
            - string
            - 'null'
        note:
          $ref: '#/components/schemas/text'
    state:
      type: string
      enum:
      - active
      - inactive
      example: active
    assignmentUser:
      description: Assignment user (tiny Vectra User)
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          $ref: '#/components/schemas/name'
      example:
        id: 123
        username: SAML:dummy@company.com
    ID:
      description: ID
      type: integer
      format: int32
      minimum: 1
    account:
      description: Account
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        url:
          $ref: '#/components/schemas/link'
        name:
          $ref: '#/components/schemas/name'
        state:
          $ref: '#/components/schemas/state'
        threat:
          $ref: '#/components/schemas/vectraScore'
        certainty:
          $ref: '#/components/schemas/vectraScore'
        severity:
          $ref: '#/components/schemas/severity'
        account_type:
          $ref: '#/components/schemas/accountType'
        tags:
          $ref: '#/components/schemas/arrayOfNames'
        note:
          oneOf:
          - $ref: '#/components/schemas/text'
          - type:
            - string
            - 'null'
        note_modified_by:
          oneOf:
          - $ref: '#/components/schemas/name'
          - type:
            - string
            - 'null'
        note_modified_timestamp:
          oneOf:
          - $ref: '#/components/schemas/isoDate'
          - type:
            - string
            - 'null'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/note'
        privilege_level:
          $ref: '#/components/schemas/privilegeLevel'
        privilege_category:
          $ref: '#/components/schemas/privilegeCategory'
        last_detection_timestamp:
          $ref: '#/components/schemas/isoDate'
        detection_set:
          $ref: '#/components/schemas/arrayOfLinks'
        probable_home:
          oneOf:
          - $ref: '#/components/schemas/text'
          - type:
            - string
            - 'null'
        assignment:
          oneOf:
          - $ref: '#/components/schemas/assignment'
          - type:
            - string
            - 'null'
        past_assignments:
          type: array
          items:
            $ref: '#/components/schemas/assignment'
        sensors:
          $ref: '#/components/schemas/arrayOfNames'
    tags:
      type: object
      properties:
        status:
          type: string
        tag_id:
          $ref: '#/components/schemas/ID'
        tags:
          type: array
          items:
          - $ref: '#/components/schemas/text'
    accountType:
      description: Account's type
      type: array
      items:
        type: string
        enum:
        - kerberos
        - o365
        example: kerberos
    results:
      type: object
      properties:
        count:
          $ref: '#/components/schemas/positiveInt'
        next:
          $ref: '#/components/schemas/link'
        previous:
          $ref: '#/components/schemas/link'
    queryAccountFields:
      type: array
      items:
        type: string
        enum:
        - id
        - url
        - name
        - state
        - threat
        - certainty
        - severity
        - account_type
        - tags
        - note
        - notes
        - note_modified_by
        - note_modified_timestamp
        - privilege_level
        - privilege_category
        - last_detection_timestamp
        - detection_set
        - probable_home
        - detection_summaries
    privilegeCategory:
      type:
      - string
      - 'null'
      enum:
      - null
      - low
      - Low
      - medium
      - Medium
      - high
      - High
      example: Medium
    Note:
      type: object
      properties:
        id:
          type: integer
        created_by:
          type: string
        modified_by:
          type: string
        note:
          type: string
        date_created:
          type: string
