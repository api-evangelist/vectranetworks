openapi: 3.2.0
info:
  title: Vectra Platform Lockdown API
  description: Comprehensive API documentation for Vectra's breach detection data, platform configuration, and health information.
  version: '3.3'
  contact:
    name: Vectra AI Support
    url: https://vectra.ai/support
servers:
- url: https://{vectra_portal_url}/api/v3.3
  description: Vectra Platform API Server
  variables:
    vectra_portal_url:
      default: platform.vectra.ai
security:
- oauth2: []
tags:
- name: Lockdown
paths:
  /lockdown:
    get:
      summary: Retrieve entities in lockdown mode
      operationId: getLockdownEntities
      tags:
      - Lockdown
      responses:
        '200':
          description: List of entities in lockdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lockdown'
components:
  schemas:
    Lockdown:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: Type of the entity in lockdown (e.g., "account", "host")
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{vectra_portal_url}/oauth2/token
          scopes: {}
