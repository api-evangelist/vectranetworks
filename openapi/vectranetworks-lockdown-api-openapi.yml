        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: Type of the entity in lockdown (e.g., "account", "host")
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{vectra_portal_url}/oauth2/token
          scopes: {}
