      parameters:
        - name: from
          in: query
          schema:
            type: integer
          description: Starting checkpoint for filtering
        - name: event_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum number of events to return
      responses:
        "200":
          description: Audit log events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEvent'

  /groups:
