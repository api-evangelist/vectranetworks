openapi: 3.0.1
info:
  title: Vectra Platform API
  description: Comprehensive API documentation for Vectra's breach detection data, platform configuration, and health information.
  version: "3.3"
  contact:
    name: Vectra AI Support
    url: https://vectra.ai/support

servers:
  - url: https://{vectra_portal_url}/api/v3.3
    description: Vectra Platform API Server
    variables:
      vectra_portal_url:
        default: "platform.vectra.ai"

security:
  - oauth2: []

paths:
  /entities:
    get:
      summary: Retrieve all entities
      operationId: getEntities
      tags:
        - Entities
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [account, host]
          description: Specifies the type of entities to retrieve (e.g., "account" or "host")
        - name: is_prioritized
          in: query
          schema:
            type: boolean
          description: Filter entities by priority (only entities above the configured priority threshold)
        - name: ordering
          in: query
          schema:
            type: string
          description: Specifies the order of results, e.g., by urgency_score, last timestamp, or last_modified_timestamp
        - name: last_detection_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
          description: Only entities with a last detection timestamp greater than or equal to this time (inclusive, ISO-8601 format)
        - name: last_detection_timestamp_lte
          in: query
          schema:
            type: string
            format: date-time
          description: Only entities with a last detection timestamp less than or equal to this time (inclusive, ISO-8601 format)
        - name: last_modified_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
          description: Only entities with a last modified timestamp greater than or equal to this time (inclusive, ISO-8601 format)
        - name: last_modified_timestamp_lte
          in: query
          schema:
            type: string
            format: date-time
          description: Only entities with a last modified timestamp less than or equal to this time (inclusive, ISO-8601 format)
        - name: name
          in: query
          schema:
            type: string
          description: Filter by entity name
        - name: note_modified_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
          description: Only entities with notes modified on or after this time (ISO-8601 format)
        - name: page
          in: query
          schema:
            type: integer
          description: Page number for pagination
        - name: page_size
          in: query
          schema:
            type: integer
            maximum: 5000
          description: Number of entities per page, with a maximum of 5000
        - name: state
          in: query
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by entity activation state (either "active" or "inactive")
        - name: tags
          in: query
          schema:
            type: string
          description: Filter entities by tags (comma-separated list of tags, returns entities with any specified tags)
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    format: uri
                    nullable: true
                  previous:
                    type: string
                    format: uri
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Entity'
                      
  /entities/{entity_id}:
    get:
      summary: Get entity by ID
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      responses:
        '200':
          description: Entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
  
  /entities/{entity_id}/notes:
    get:
      summary: Get entity notes
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      summary: Add note to entity
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'

  /entities/{entity_id}/notes/{note_id}:
    get:
      summary: Get specific entity note
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    patch:
      summary: Update entity note
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Updated note
    delete:
      summary: Delete entity note
      tags:
        - Entities
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: note_id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
      responses:
        '204':
          description: Note deleted successfully
          
  /detections:
    get:
      summary: Retrieve all detection events
      operationId: getDetections
      tags:
        - Detections
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
            maximum: 5000
        - name: ordering
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: threat_gte
          in: query
          schema:
            type: integer
        - name: certainty_gte
          in: query
          schema:
            type: integer
        - name: canonicalize
          in: query
          schema:
            type: boolean
          description: Ordering options by timestamp or score
      responses:
        '200':
          description: List of detections
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type: string
                    nullable: true
                  previous:
                    type: string
                    nullable: true
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Detection'
                      
    patch:
      summary: Mark/unmark detections as fixed
      operationId: markDetectionsAsFixed
      tags:
        - Detections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                detectionIdList:
                  type: array
                  items:
                    type: integer
                mark_as_fixed:
                  type: boolean
      responses:
        '200':
          description: Success response

  /detections/{detection_id}:
    get:
      summary: Retrieve a single detection event
      operationId: getDetectionById
      tags:
        - Detections
      parameters:
        - name: detection_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the detection
      responses:
        "200":
          description: Detection event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
    patch:
      summary: Mark detection as fixed
      operationId: markDetectionAsFixed
      tags:
        - Detections
      parameters:
        - name: detection_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the detection
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                detectionIdList:
                  type: array
                  items:
                    type: integer
                  description: List of detection IDs to mark as fixed
                mark_as_fixed:
                  type: boolean
                  description: Boolean to mark detection as fixed
      responses:
        "204":
          description: Detection marked as fixed successfully
  
  /detections/{id}/pcap:
    get:
      summary: Download PCAP data for detection
      operationId: getPCAP
      tags:
        - Detections
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: PCAP file
          content:
            application/vnd.tcpdump.pcap:
              schema:
                type: string
                format: binary
                
  /detections/{id}/notes:
    get:
      summary: Get detection notes
      tags:
