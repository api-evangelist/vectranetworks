          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchEnablement'
                
    post:
      summary: Enable/disable Vectra Match
      tags:
        - Match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_serial:
                  type: string
                desired_state:
                  type: boolean
      responses:
        '200':
          description: Updated enablement status

  /vectra-match/stats:
    get:
      summary: Retrieve Vectra Match statistics
      operationId: getVectraMatchStats
      tags:
        - Match
      responses:
        "200":
          description: Vectra Match statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchStats'

  /vectra-match/alert-stats:
    get:
      summary: Retrieve Vectra Match alert statistics
      operationId: getVectraMatchAlertStats
      tags:
        - Match
      responses:
        "200":
          description: Vectra Match alert statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchAlertStats'

  /vectra-match/status:
    get:
      summary: Retrieve Vectra Match status
      operationId: getVectraMatchStatus
      tags:
        - Match
      responses:
        "200":
          description: Vectra Match status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchStatus'

  /vectra-match/available-devices:
    get:
      summary: Retrieve available devices for Vectra Match
      operationId: getVectraMatchAvailableDevices
      tags:
        - Match
      responses:
        "200":
          description: List of available devices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchAvailableDevices'

  /vectra-match/rules:
    get:
      summary: Retrieve Vectra Match rules
      operationId: getVectraMatchRules
      tags:
        - Match
      responses:
        "200":
          description: List of Vectra Match rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VectraMatchRule'
    post:
      summary: Create or upload Vectra Match rules
      operationId: uploadVectraMatchRules
      tags:
        - Match
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Rules file to upload
      responses:
        "201":
          description: Vectra Match rules uploaded successfully

  /vectra-match/assignment:
    get:
      summary: Retrieve Vectra Match assignment details
      operationId: getVectraMatchAssignment
      tags:
        - Match
      responses:
        "200":
          description: Vectra Match assignment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectraMatchAssignment'
    post:
      summary: Assign devices to Vectra Match
      operationId: assignVectraMatchDevices
      tags:
        - Match
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_ids:
                  type: array
                  items:
                    type: integer
                  description: List of device IDs to assign
      responses:
        "201":
          description: Devices assigned successfully



components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{vectra_portal_url}/oauth2/token
          scopes: {}
          
  schemas:

    Detection:
      type: object
      properties:
        id:
          type: integer
        detection:
          type: string
        category:
          type: string
        src_ip:
          type: string
        state:
          type: string
        threat:
          type: integer
        certainty:
          type: integer
        first_timestamp:
          type: string
          format: date-time
        last_timestamp:
          type: string
          format: date-time

    Account:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        threat:
          type: integer
        certainty:
          type: integer
        last_detection_timestamp:
          type: string
          format: date-time

    Health:
      type: object
      properties:
        status:
          type: string
        components:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string

    ThreatFeed:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        severity:
          type: string
        file:
          type: string
          format: uri
          description: URI of the threat feed file

    Entity:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        urgency:
          type: integer
        importance:
          type: integer
        last_detection_timestamp:
          type: string
          format: date-time

    Assignment:
      type: object
      properties:
        id:
          type: integer
        assigned_by:
          type: string
        assigned_to:
          type: string
        date_assigned:
          type: string
          format: date-time
        date_resolved:
          type: string
          format: date-time
        outcome:
          type: integer

    AuditLogEvent:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        username:
          type: string
        event_timestamp:
          type: string
          format: date-time
        message:
          type: string
        result_status:
          type: string
        event_action:
          type: string

    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        importance:
          type: string
        members:
          type: array
          items:
            type: string

    Lockdown:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: Type of the entity in lockdown (e.g., "account", "host")

    Host:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        threat:
          type: integer
        certainty:
          type: integer
        ip:
          type: string
        last_detection_timestamp:
          type: string
          format: date-time

    Note:
      type: object
      properties:
        id:
          type: integer
        created_by:
          type: string
        modified_by:
          type: string
        note:
          type: string
        date_created:
          type: string
          format: date-time
        date_modified:
          type: string
          format: date-time


    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        last_login_timestamp:
          type: string
          format: date-time
          
    VectraMatchEnablement:
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicates if Vectra Match is enabled

    VectraMatchStats:
      type: object
      properties:
        total_rules:
          type: integer
          description: Total number of rules
        active_rules:
          type: integer
          description: Number of active rules
        matched_events:
          type: integer
          description: Total matched events

    VectraMatchAlertStats:
      type: object
      properties:
        total_alerts:
          type: integer
          description: Total number of alerts
        critical_alerts:
          type: integer
          description: Number of critical alerts
        high_alerts:
          type: integer
          description: Number of high alerts
        medium_alerts:
          type: integer
          description: Number of medium alerts
        low_alerts:
          type: integer
          description: Number of low alerts

    VectraMatchStatus:
      type: object
      properties:
        status:
          type: string
          description: Current status of Vectra Match
        last_updated:
          type: string
          format: date-time
          description: Timestamp of the last status update

    VectraMatchAvailableDevices:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          description: Device status (e.g., "available", "assigned")

    VectraMatchRule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        created_timestamp:
          type: string
          format: date-time

    VectraMatchAssignment:
      type: object
      properties:
        assigned_devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        unassigned_devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        

    EntityScoring:
      type: object
      properties:
        entity_id:
          type: integer
        entity_type:
          type: string
        urgency_score:
          type: integer
        event_timestamp:
          type: string
          format: date-time
        name:
          type: string
        last_detection_id:
          type: integer
        severity:
          type: string
          enum: ["Low", "Medium", "High"]


    DetectionEvent:
      type: object
      properties:
        id:
          type: integer
        detection_id:
          type: integer
        category:
          type: string
        threat:
          type: integer
        certainty:
          type: integer
        event_timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: ["Low", "Medium", "High", "Critical"]
        detection_type:
          type: string
        entity_type:
          type: string
          enum: ["Account", "Host"]
        mitre:
          type: string
          description: MITRE ATT&CK technique associated with the detection
          
    Tag:
      type: object
      properties:
        status:
          type: string
          enum: [success, failure]
          description: Status of tagging request
        tag_id:
          type: string
          description: Corresponds to the account, host, or detection id of the object being tagged
        tags:
          type: array
          items:
            type: string
          description: List of tags for the host or detection object
        message:
          type: string
          description: Error message if operation was unsuccessful. Only present when status is 'failure'
        invalid_tags:
          type: array
          items:
            type: string
          description: List of tags which are invalid. Only present when status is 'failure'
