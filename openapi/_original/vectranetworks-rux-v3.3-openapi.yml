      parameters:
        - name: detection_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the detection
      responses:
        "200":
          description: Detection tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      summary: Add tags to a detection
      operationId: addDetectionTags
      tags:
        - Tagging
      parameters:
        - name: detection_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the detection
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tags to add to the detection
      responses:
        "201":
          description: Tags added successfully

  /threatFeeds:
    get:
      summary: Retrieve all threat feeds
      operationId: getThreatFeeds
      tags:
        - Threat Feeds
      responses:
        '200':
          description: List of threat feeds
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThreatFeed'
    post:
      summary: Create a new threat feed
      operationId: createThreatFeed
      tags:
        - Threat Feeds
      responses:
        "201":
          description: Threat feed created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatFeed'

  /threatFeeds/{id}:
    get:
      summary: Retrieve a specific threat feed
      operationId: getThreatFeedById
      tags:
        - Threat Feeds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the threat feed
      responses:
        "200":
          description: Threat feed details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatFeed'
    patch:
      summary: Update a threat feed
      operationId: updateThreatFeed
      tags:
        - Threat Feeds
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatFeed'
      responses:
        "204":
          description: Threat feed updated successfully

  /assignments:
    get:
      summary: Retrieve all assignments
      operationId: getAssignments
      tags:
        - Assignments
      parameters:
        - name: resolved
          in: query
          schema:
            type: boolean
          description: Filter by resolved status
      responses:
        "200":
          description: A list of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'

  /assignments/{assignment_id}:
    get:
      summary: Retrieve specific assignment details
      operationId: getAssignmentById
      tags:
        - Assignments
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: integer
          description: Unique ID for the assignment
      responses:
        "200":
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
    patch:
      summary: Resolve an assignment
      operationId: resolveAssignment
      tags:
        - Assignments
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: integer
                  description: Outcome of the assignment
                note:
                  type: string
                  description: Additional notes for assignment resolution
      responses:
        "204":
          description: Assignment resolved successfully

  /events/entity_scoring:
    get:
      summary: Retrieve entity scoring events
      operationId: getEntityScoringEvents
      tags:
        - Events  
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [account, host]
          description: Specifies the type of entity scoring events (e.g., "account" or "host")
        - name: from
          in: query
          schema:
            type: integer
          description: Starting checkpoint for filtering scoring events
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
          description: Maximum number of events to return, with a default of 500 if unspecified
        - name: event_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
          description: Start date/time for scoring events (inclusive, ISO-8601 format)
        - name: event_timestamp_lte
          in: query
          schema:
            type: string
            format: date-time
          description: End date/time for scoring events (inclusive, ISO-8601 format)
        - name: include_score_decreases
          in: query
          schema:
            type: boolean
          description: Whether to include events that reflect score decreases
      responses:
        "200":
          description: A list of entity scoring events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityScoring'

  /events/detections:
    get:
      summary: Retrieve detection events
      operationId: getDetectionEvents
      tags:
        - Events
      parameters:
        - name: from
          in: query
          schema:
            type: integer
          description: Starting checkpoint for filtering detection events
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 1000
          description: Maximum number of detection events to return, default is 500
        - name: event_timestamp_gte
          in: query
          schema:
            type: string
            format: date-time
          description: Start date/time for detection events (inclusive, ISO-8601 format)
        - name: event_timestamp_lte
          in: query
          schema:
            type: string
            format: date-time
          description: End date/time for detection events (inclusive, ISO-8601 format)
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [account, host]
          description: Type of the related entity ("account" or "host")
        - name: detection_id
          in: query
          schema:
            type: integer
          description: Filter by a specific Detection ID
        - name: ordering
          in: query
          schema:
            type: string
            enum: ["event_timestamp", "-event_timestamp"]
          description: Ordering options, with default ascending by "event_timestamp"
      responses:
        '200':
          description: List of detection events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  next_checkpoint:
                    type: integer
                  remaining_count:
                    type: integer
                
  /events/audits:
    get:
      summary: Retrieve audit log events
      operationId: getAuditEvents
      tags:
