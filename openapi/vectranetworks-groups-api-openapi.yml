openapi: 3.2.0
info:
  title: Vectra Platform Groups API
  description: Comprehensive API documentation for Vectra's breach detection data, platform configuration, and health information.
  version: '3.3'
  contact:
    name: Vectra AI Support
    url: https://vectra.ai/support
servers:
- url: https://{vectra_portal_url}/api/v3.3
  description: Vectra Platform API Server
  variables:
    vectra_portal_url:
      default: platform.vectra.ai
security:
- oauth2: []
tags:
- name: Groups
paths:
  /groups:
    get:
      summary: Retrieve all groups
      operationId: getGroups
      tags:
      - Groups
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
    post:
      summary: Create new group
      tags:
      - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                members:
                  type: array
                  items:
                    type: string
                description:
                  type: string
                importance:
                  type: string
      responses:
        '200':
          description: Created group
components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        importance:
          type: string
        members:
          type: array
          items:
            type: string
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://{vectra_portal_url}/oauth2/token
          scopes: {}
