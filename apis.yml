aid: vectranetworks
name: Vectra AI
description: Vectra AI (founded as Vectra Networks, a Khosla Ventures portfolio company)
  is an AI-native network detection and response (NDR) platform that correlates attacker
  behavior across network, identity, cloud, and SaaS domains. Its Attack Signal Intelligence
  prioritizes real threats for SOC teams, and the platform exposes REST APIs — the
  OAuth2-secured Vectra Platform API (RUX) and the token-based Vectra Detect API —
  for pulling detections, entities, and health data into SIEM, SOAR, EDR, and ITSM
  workflows.
